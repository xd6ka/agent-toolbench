name: tests

# The scoring and sandbox code needs no model and no network: every test in this
# repository runs against fixtures on disk. The model runs (9-18 minutes on a
# CPU) stay local — GitHub's runners have no Ollama and no business trying.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run the tests
        run: python -m pytest -q
